<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum – Björn Mismahl</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #F5F0E8; --gold: #2C4A7C; --charcoal: #1C1C1C; --warm-mid: #6B6356; }
    body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--charcoal); padding: 6rem 2rem 4rem; }
    .wrap { max-width: 680px; margin: 0 auto; }
    .label { font-size: .65rem; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); margin-bottom: .8rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; margin-bottom: 1.5rem; }
    .divider { width: 52px; height: 1px; background: var(--gold); margin: 1.5rem 0 2rem; }
    p { font-size: .85rem; font-weight: 200; color: var(--warm-mid); line-height: 2; margin-bottom: 1.5rem; }
    strong { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 400; color: var(--charcoal); display: block; margin-bottom: .3rem; }
    a { color: var(--gold); text-decoration: none; }
    nav { position: fixed; top: 0; left: 0; right: 0; padding: 1.4rem 3rem; background: rgba(245,240,232,.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(44,74,124,.18); }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; color: var(--charcoal); }
    .logo span { color: var(--gold); }
  </style>
</head>
<body>
  <nav><a class="logo" href="/">Björn <span>Mismahl</span></a></nav>
  <div class="wrap">
    <p class="label">Rechtliches</p>
    <h1>Impressum</h1>
    <div class="divider"></div>
    <p><strong>Angaben gemäß § 5 TMG</strong>Björn Mismahl<br>Schellenbergstr. 8d<br>45134 Essen</p>
    <p><strong>Kontakt</strong>E-Mail: <a href="mailto:bjoern@mismahl.com">bjoern@mismahl.com</a></p>
    <p><strong>Verantwortlich für den Inhalt</strong>Björn Mismahl, Schellenbergstr. 8d, 45134 Essen</p>
  </div>
</body>
</html>
